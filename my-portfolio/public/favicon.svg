<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="dGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0C21" />
      <stop offset="100%" stop-color="#05030A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="100" height="100" rx="26" fill="url(#bgGrad)" stroke="url(#dGrad)" stroke-width="2.5" stroke-opacity="0.5" />

  <!-- Monogram D -->
  <g filter="url(#glow)">
    <!-- Vertical stem -->
    <rect x="25" y="22" width="14" height="56" rx="7" fill="url(#dGrad)" />
    <!-- Curved D loop -->
    <path d="M 32 22 H 54 C 69 22 79 33 79 50 C 79 67 69 78 54 78 H 32 V 64 H 52 C 60 64 65 58 65 50 C 65 42 60 36 52 36 H 32 Z" fill="url(#dGrad)" />
    <!-- Tech Accent Cyan Node -->
    <circle cx="70" cy="27" r="4.5" fill="#06B6D4" />
  </g>
</svg>